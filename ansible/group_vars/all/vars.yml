# ── Domain ────────────────────────────────────────────────────────────────────
domain: "3.108.9.48.nip.io"
app_dir: "/home/ubuntu/DirectHarvest"
aws_region: "ap-south-1"
s3_bucket: "directharvest-logs"

# ── Database ──────────────────────────────────────────────────────────────────
DB_NAME: "directharvest"
DB_USERNAME: "directharvest_user"

# ── JWT ───────────────────────────────────────────────────────────────────────
JWT_ISSUER: "directharvest"
JWT_ACCESS_TOKEN_EXPIRATION_MS: "86400000"
JWT_REFRESH_TOKEN_EXPIRATION_MS: "2592000000"

# ── Cloudinary ────────────────────────────────────────────────────────────────
CLOUDINARY_CLOUD_NAME: "drkcwf5i6"
CLOUDINARY_DEFAULT_FOLDER: "directharvest"

# ── Cloudinary retry (non-secret) ─────────────────────────────────────────────
CLOUDINARY_DELETE_RETRY_ENABLED: "true"
CLOUDINARY_DELETE_RETRY_INITIAL_DELAY_MS: "30000"
CLOUDINARY_DELETE_RETRY_FIXED_DELAY_MS: "30000"
CLOUDINARY_DELETE_RETRY_BATCH_SIZE: "25"
CLOUDINARY_DELETE_RETRY_MAX_ATTEMPTS: "5"
CLOUDINARY_DELETE_RETRY_INITIAL_BACKOFF_MS: "30000"
CLOUDINARY_DELETE_RETRY_MAX_BACKOFF_MS: "900000"