spring:
  main:
    banner-mode: off
  datasource:
    url: jdbc:h2:mem:directharvest_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  test:
    database:
      replace: none
  flyway:
    enabled: false

cloudinary:
  delete-retry:
    enabled: false

logging:
  level:
    root: WARN
    org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer: ERROR

