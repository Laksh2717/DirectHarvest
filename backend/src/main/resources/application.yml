spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/directharvest}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: ${JPA_OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}

security:
  jwt:
    issuer: ${JWT_ISSUER:directharvest}
    secret: ${JWT_SECRET:change-this-secret-to-a-strong-value-min-32-chars}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:86400000}
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:2592000000}
  cookies:
    secure: ${AUTH_COOKIE_SECURE:false}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  delete-retry:
    enabled: ${CLOUDINARY_DELETE_RETRY_ENABLED:true}
    initial-delay-ms: ${CLOUDINARY_DELETE_RETRY_INITIAL_DELAY_MS:30000}
    fixed-delay-ms: ${CLOUDINARY_DELETE_RETRY_FIXED_DELAY_MS:30000}
    batch-size: ${CLOUDINARY_DELETE_RETRY_BATCH_SIZE:25}
    max-attempts: ${CLOUDINARY_DELETE_RETRY_MAX_ATTEMPTS:5}
    initial-backoff-ms: ${CLOUDINARY_DELETE_RETRY_INITIAL_BACKOFF_MS:30000}
    max-backoff-ms: ${CLOUDINARY_DELETE_RETRY_MAX_BACKOFF_MS:900000}

